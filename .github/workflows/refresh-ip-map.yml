name: Refresh IP overview and publish map

on:
  push:
    branches: [main]
    paths:
      - data/**
      - independent-enrichment/**
      - india/additional-ai-campaigns/records.json
      - research/first-party/**
      - scripts/ip_enrichment.py
      - scripts/refresh_ip_overview.py
      - scripts/download_enrichment_data.py
      - scripts/render_ip_map.py
      - scripts/map-ui/**
      - maps/assets/**
      - requirements-enrichment.txt
      - .github/workflows/refresh-ip-map.yml
  workflow_dispatch:

concurrency:
  group: ip-map-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    if: github.repository == 'Ella-Bakshi/ai-attacker-threat-research' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the approved MMDB reader wheel
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-enrichment.txt
      - name: Download open enrichment snapshots
        run: python -B scripts/download_enrichment_data.py --db-dir "$RUNNER_TEMP/open-enrichment"
      - name: Enrich the authoritative IP CSV
        run: python -B scripts/refresh_ip_overview.py --db-dir "$RUNNER_TEMP/open-enrichment"
      - name: Generate the map
        run: python -B scripts/render_ip_map.py --root .
      - name: Stage generated files only
        run: |
          mkdir -p "$RUNNER_TEMP/generated/data/enrichment" "$RUNNER_TEMP/generated/maps"
          for file in data/ip-overview.csv data/ip-overview.json data/enrichment/sources.json data/enrichment/summary.json maps/index.html maps/world.svg maps/render-metadata.json; do
            cp -- "$file" "$RUNNER_TEMP/generated/$file"
          done
      - name: Save generated files for the isolated commit job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-ip-map
          path: ${{ runner.temp }}/generated
          if-no-files-found: error
          retention-days: 1
      - name: Package the standalone map
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: maps

  save-generated:
    needs: build
    if: github.repository == 'Ella-Bakshi/ai-attacker-threat-research' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-ip-map
          path: ${{ runner.temp }}/generated
      - name: Copy the fixed generated-file allowlist
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || { echo 'Main changed during the build; leaving newer data untouched.'; exit 1; }
          test "$(find "$RUNNER_TEMP/generated" -type f | wc -l)" -eq 7
          for file in data/ip-overview.csv data/ip-overview.json data/enrichment/sources.json data/enrichment/summary.json maps/index.html maps/world.svg maps/render-metadata.json; do
            test -f "$RUNNER_TEMP/generated/$file" && test ! -L "$RUNNER_TEMP/generated/$file"
            cp -- "$RUNNER_TEMP/generated/$file" "$file"
            git add -- "$file"
          done
      - name: Commit generated data with a step-scoped credential
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh IP enrichment and generated map'
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::$auth"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          fi

  deploy:
    needs: [build, save-generated]
    if: github.repository == 'Ella-Bakshi/ai-attacker-threat-research' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish the generated map
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
